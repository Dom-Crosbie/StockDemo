name: copilot-cli-smartbear-mcp
permissions:
  contents: write
on:
  push:
    branches:
      - main
      - update-openapi-spec
  workflow_dispatch:
    inputs:
      ai-prompt:
        description: 'Prompt to use with SmartBear MCP Server'
        default: 'Using SmartBear Swagger AI-powered generation tool using domcrosbie-cc0 organization, update the existing Stock Portfolio API with a minor change and publish a new patch version.'
        required: false
        type: string

jobs:
  copilot-cli:
    runs-on: ubuntu-latest

    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      SWAGGER_API_KEY: ${{ secrets.SWAGGER_API_KEY }}
      CI: true
      NO_COLOR: 1
      TERM: dumb

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Debug that token is actually set
        shell: bash
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "❌ COPILOT_GITHUB_TOKEN is EMPTY inside the runner."
            exit 1
          fi
          echo "✅ COPILOT_GITHUB_TOKEN is set (length ${#COPILOT_GITHUB_TOKEN})"

      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(cat .swagger-version 2>/dev/null || echo "1.0.0")
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "$NEW_VERSION" > .swagger-version
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Bumped $CURRENT → $NEW_VERSION"

      - name: Install GitHub Copilot CLI (0.0.358)
        run: |
          npm install -g @github/copilot@0.0.358

      - name: Configure SmartBear MCP server
        run: |
          mkdir -p "$HOME/.copilot"

          cat > "$HOME/.copilot/mcp-smartbear.json" << 'EOF'
          {
            "mcpServers": {
              "smartbear": {
                "type": "local",
                "command": "npx",
                "args": ["-y", "@smartbear/mcp@latest"],
                "tools": ["*"],
                "env": {
                  "SWAGGER_API_KEY": "${SWAGGER_API_KEY}"
                }
              }
            }
          }
          EOF

          echo "=== $HOME/.copilot/mcp-smartbear.json ==="
          cat "$HOME/.copilot/mcp-smartbear.json"

      - name: Test-start SmartBear MCP manually
        run: |
          echo "Starting MCP manually..."
          echo "SWAGGER_API_KEY length=${#SWAGGER_API_KEY}"
          npx -y @smartbear/mcp@latest --help || echo "MCP server failed to start"

      - name: Execute action using SmartBear MCP tools
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ env.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SWAGGER_API_KEY: ${{ secrets.SWAGGER_API_KEY }}
        run: |
          # Fetch the existing Stock Portfolio API and publish a new patch version with a minor change
          timeout --foreground --signal=TERM --kill-after=30s 600s \
            copilot \
              --additional-mcp-config @"$HOME/.copilot/mcp-smartbear.json" \
              --log-level debug \
              --log-dir ./copilot-logs \
              -p "Using the SmartBear SwaggerHub MCP tool for the domcrosbie-cc0 organization, fetch the latest version of the Stock Portfolio API. Make a minor backwards-compatible change to the API (such as adding a new optional field or endpoint). Publish it as a new version ${{ steps.version.outputs.version }} and set the OpenAPI info.version field to ${{ steps.version.outputs.version }}." \
              --allow-all-tools \
              --allow-all-paths \
              </dev/null || echo "copilot exited with code $?"

          # Validate the new version against SwaggerHub governance and standardisation rules
          timeout --foreground --signal=TERM --kill-after=30s 600s \
            copilot \
              --additional-mcp-config @"$HOME/.copilot/mcp-smartbear.json" \
              --log-level debug \
              --log-dir ./copilot-logs \
              -p "The Stock Portfolio API version ${{ steps.version.outputs.version }} was just published to SwaggerHub under the domcrosbie-cc0 organization. Retrieve the standardisation and governance rules for that org and validate the API against them. If any governance errors are raised, fix the API and republish." \
              --allow-all-tools \
              --allow-all-paths \
              </dev/null || echo "copilot exited with code $?"

          echo "=== Copilot logs (if any) ==="
          ls -R ./copilot-logs || true

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .swagger-version
          git commit -m "chore: bump Stock Portfolio API to ${{ steps.version.outputs.version }} [skip ci]"
          git push
